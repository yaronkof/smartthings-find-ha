locate:
  name: Locate SmartTag
  description: Request a fresh location for one or more SmartTags.
  target:
    entity:
      domain:
        - device_tracker
        - button
  fields:
    device_id:
      name: SmartTag device ID
      description: Optional Samsung SmartTag device ID when no entity target is used.
      example: ABC123
      selector:
        text:
refresh:
  name: Refresh SmartTags
  description: Refresh all SmartThings Find SmartTags now.
